<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Region Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col font-sans overflow-hidden">

    <!-- Top Navigation -->
    <nav class="bg-gray-800 p-3 shadow-md flex justify-between items-center z-10 flex-wrap gap-2">
        <div class="flex items-center gap-3">
            <h1 class="text-lg font-bold text-blue-400">Map Builder</h1>
            <span class="text-xs px-2 py-1 rounded bg-gray-700 text-gray-300" id="save-status">Saved locally</span>
        </div>
        <div class="flex items-center gap-2 flex-wrap">
            <div class="bg-gray-700 p-1 rounded-lg flex gap-1">
                <button id="btn-edit-mode" class="px-3 py-1.5 rounded bg-blue-600 text-white font-semibold shadow text-sm">Edit</button>
                <button id="btn-view-mode" class="px-3 py-1.5 rounded text-gray-300 hover:bg-gray-600 text-sm">View</button>
            </div>
            <div class="h-6 w-px bg-gray-600 mx-1"></div>
            <button id="btn-undo" class="px-3 py-1.5 rounded bg-gray-700 hover:bg-gray-600 disabled:opacity-40 text-sm" title="Undo" disabled>↶ Undo</button>
            <button id="btn-redo" class="px-3 py-1.5 rounded bg-gray-700 hover:bg-gray-600 disabled:opacity-40 text-sm" title="Redo" disabled>↷ Redo</button>
            <div class="h-6 w-px bg-gray-600 mx-1"></div>
            <label class="cursor-pointer bg-green-700 hover:bg-green-600 px-3 py-1.5 rounded text-sm" title="Export JSON Backup">
                Export JSON
                <button id="btn-export" class="hidden"></button>
            </label>
            <label class="cursor-pointer bg-yellow-700 hover:bg-yellow-600 px-3 py-1.5 rounded text-sm" title="Import JSON Backup">
                Import JSON
                <input type="file" id="file-import" accept=".json" class="hidden">
            </label>
                   <button id="btn-reset-zoom" class="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded text-sm" title="Reset Zoom">Reset Zoom</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex-1 flex overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-80 bg-gray-800 border-r border-gray-700 flex flex-col shadow-xl z-10">
            <div class="p-5 flex-1 overflow-y-auto">
                <div id="edit-panel">
                    <h2 class="text-lg font-bold mb-3 text-blue-300">Editing</h2>
                    <ul class="list-disc pl-5 space-y-1 text-gray-300 text-sm mb-6">
                        <li>Click to add points.</li>
                        <li><strong>Click the first point</strong> (or Enter) to close.</li>
                        <li>Click a shape to drag its vertices.</li>
                        <li>Backspace removes last point. Esc cancels.</li>
                    </ul>
                    <h3 class="text-md font-semibold text-gray-300 mb-2">Regions</h3>
                    <ul id="region-list" class="space-y-1 text-sm text-gray-400"></ul>
                </div>
                <div id="view-panel" class="hidden">
                    <h2 class="text-2xl font-bold mb-2 text-white" id="info-title">Select a Region</h2>
                    <div class="w-12 h-1 bg-blue-500 mb-4 rounded"></div>
                    <div id="info-cards" class="space-y-2 text-sm mt-4"></div>
                </div>
            </div>
        </aside>

        <!-- Map Area -->
        <main class="flex-1 relative overflow-auto bg-black flex justify-center items-start">
            <div id="map-wrapper" class="map-container mode-edit inline-block m-auto shadow-2xl">
                <img id="map-image" src="map1.jpg" alt="Map Background">
                <svg id="map-svg" preserveAspectRatio="none">
                    <g id="regions-group"></g>
                    <g id="vertices-group"></g> <!-- Vertex Handles Layer -->
                    <g id="labels-group"></g>
                    <g id="drawing-group">
                        <polyline id="temp-line-preview"></polyline>
                        <polyline id="temp-line"></polyline>
                        <circle id="close-hint" class="close-hint" style="display:none"></circle>
                    </g>
                </svg>
            </div>
        </main>
    </div>

    <!-- Region Modal -->
    <div id="region-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center hidden z-50">
        <div class="bg-gray-800 p-6 rounded-xl shadow-2xl w-[32rem] max-w-full">
            <h3 class="text-xl font-bold mb-4" id="modal-heading">Region Details</h3>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-400 mb-1">Title</label>
                <input type="text" id="modal-title" class="w-full bg-gray-900 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500">
            </div>
            
            <!-- Structured Information Cards -->
            <div class="grid grid-cols-2 gap-3 mb-4 max-h-64 overflow-y-auto pr-2">
                <div><label class="text-xs text-gray-400">Climate</label><input type="text" id="det-climate" class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white"></div>
                <div><label class="text-xs text-gray-400">Resources</label><input type="text" id="det-resources" class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white"></div>
                <div><label class="text-xs text-gray-400">Capital</label><input type="text" id="det-capital" class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white"></div>
                <div><label class="text-xs text-gray-400">Other Settlements</label><input type="text" id="det-settlements" class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white"></div>
                <div><label class="text-xs text-gray-400">Government</label><input type="text" id="det-gov" class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white"></div>
                <div><label class="text-xs text-gray-400">Primary Export</label><input type="text" id="det-export" class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white"></div>
                <div><label class="text-xs text-gray-400">State Religion</label><input type="text" id="det-religion" class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white"></div>
                <div><label class="text-xs text-gray-400">Danger Level</label><input type="text" id="det-danger" class="w-full bg-gray-900 border border-gray-600 rounded px-2 py-1 text-sm text-white"></div>
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-400 mb-1">Color</label>
                <input type="color" id="modal-color" value="#3b82f6" class="w-full h-10 bg-gray-900 border border-gray-600 rounded cursor-pointer">
            </div>
            <div class="flex justify-between">
                <button id="btn-modal-delete" class="px-3 py-2 rounded text-red-400 hover:text-red-300 text-sm hidden">Delete</button>
                <div class="flex gap-2 ml-auto">
                    <button id="btn-modal-cancel" class="px-4 py-2 rounded text-gray-400 hover:text-white hover:bg-gray-700">Cancel</button>
                    <button id="btn-modal-save" class="px-4 py-2 rounded bg-blue-600 hover:text-white font-semibold">Save</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-4 right-4 bg-gray-800 border border-gray-700 px-4 py-2 rounded-lg shadow-xl opacity-0 pointer-events-none z-50"></div>

    <script src="app.js"></script>
</body>
</html>
